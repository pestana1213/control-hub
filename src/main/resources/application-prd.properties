management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
management.otlp.metrics.export.url=https://prometheus.tail654c62.ts.net/api/v1/otlp/v1/metrics
management.otlp.metrics.export.step=30s

spring.datasource.url=jdbc:postgresql://control-hub-postgres:5432/control_hub
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.liquibase.enabled=true
spring.liquibase.change-log=db/changelog/db.changelog-master.yaml