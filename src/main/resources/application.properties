spring.application.name=control-hub

management.endpoints.web.exposure.include=prometheus,health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,kubernetesInformers
management.observations.annotations.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/controlhub
spring.datasource.username=controlhub
spring.datasource.password=controlhub
spring.liquibase.enabled=true
spring.liquibase.change-log=db/changelog/db.changelog-master.yaml

control.hub.operations.allowed-namespaces=*
control.hub.operations.allowed-applications=*
control.hub.operations.rollout-timeout=180s
control.hub.operations.rollout-poll-interval=1s

control.hub.applications.status-events.retention=14d
control.hub.applications.status-events.purge-interval=1h
control.hub.applications.status-events.max-returned=50
