services:
  postgres:
    image: postgres:17
    container_name: controlhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: controlhub
      POSTGRES_USER: controlhub
      POSTGRES_PASSWORD: controlhub
    ports:
      - "5432:5432"
    volumes:
      - controlhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlhub -d controlhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  controlhub-postgres-data: